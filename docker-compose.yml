version: '3.8' #Verison de docker-compose
services:
  php:
    build: .
    ports:
      - "8080:80"
    volumes:
        - .:/var/www/html
  db:
    image: mysql:latest
    environment:
      - MYSQL_DATABASE=AdministracionProyectosTecnologiasInformacion
      - MYSQL_USER=apti
      - MYSQL_PASSWORD=apti
      - MYSQL_ALLOW_EMPTY_PASSWORD=1
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306